; Pumpastic e-ink status display — Waveshare ESP32-S3-PhotoPainter (7.3" Spectra E6)
;
; Thin client: wake → telemetry → GET a pre-rendered 4-bpp frame from the Pi →
; refresh panel → deep sleep for as long as the server says (X-Next-Wake-S).
; All layout lives in controller/src/eink_display.py. See docs/04-protocols.md.
;
; Board: ESP32-S3R8 — 16 MB flash, 8 MB octal PSRAM (confirmed by esptool 2026-10-01).
; Back up the factory firmware before the first flash (see docs/04-protocols.md). The
; image is not in the repo: it is the vendor's, and a dump can hold WiFi credentials.

[env:photopainter]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    lewisxhe/XPowersLib@^0.2.6

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
