; Shared settings for all environments
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = COM3
monitor_filters = esp32_exception_decoder

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    adafruit/Adafruit NeoPixel@^1.12

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; USB upload (first flash, or when COM3 is available)
[env:esp32s3]
upload_port = COM3

; OTA upload for WiFi nodes. Not usable with SERIAL_BRIDGE_MODE (radio off), which is
; how Tank A runs; see docs/04-protocols.md for flashing it over USB from the Pi.
; Usage: PUMPASTIC_OTA_PASSWORD=... pio run -e esp32s3-ota --target upload
[env:esp32s3-ota]
upload_protocol = espota
upload_port = 192.168.1.40
upload_flags = --auth=${sysenv.PUMPASTIC_OTA_PASSWORD}
