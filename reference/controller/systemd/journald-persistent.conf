# Pumpastic: keep logs across reboots so outages leave evidence (added 2026-10-15).
# Capped so the journal cannot fill the SD card; SyncIntervalSec batches writes.
# Install on the Pi as /etc/systemd/journald.conf.d/pumpastic-persistent.conf, then:
#   sudo mkdir -p /var/log/journal && sudo systemctl restart systemd-journald && sudo journalctl --flush
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=3month
SyncIntervalSec=5m
